version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
      - ./charts:/app/charts
      - ./src:/app/src
      - ./backend:/app/backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_PATH=/app/db/alphalens.db
      - RAW_DATA_DIR=/app/db/raw
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    volumes:
      - ./db:/app/db
      - ./charts:/app/charts
      - ./src:/app/src
      - ./backend:/app/backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_PATH=/app/db/alphalens.db
      - RAW_DATA_DIR=/app/db/raw
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.app.celery_app worker --loglevel=info --concurrency=2

volumes:
  redis_data:
